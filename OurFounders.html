<title>Propelr: Our Founders</title>

<style>
:root{--green:#59A398;--navy:#1B2F5B;--purple:#A6B3D5;color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:'Inter',Arial,sans-serif;color:#000;padding:.5rem}

.heading{font-size:20px;font-weight:700;color:var(--navy);line-height:1.3;margin-bottom:12px}
.text{font-size:18px;color:#000;line-height:1.7;margin-bottom:24px}

.founder-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.founder-grid{grid-template-columns:1fr}}

.founder-card{
  background:linear-gradient(180deg,#ffffff 0%,#eef2fb 100%);
  border:1px solid var(--purple);border-radius:18px;padding:22px;
  display:flex;gap:18px;align-items:center;
}
.founder-photo{width:96px;height:96px;border-radius:50%;object-fit:cover;flex-shrink:0;border:4px solid #ffffff;box-shadow:0 0 0 1px var(--purple)}
.founder-name{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px}
.founder-title{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
</style>
</head>
