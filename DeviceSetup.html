<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Propelr: Device Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#5D70AE;--green:#59A398;--navy:#1B2F5B;--mint:#DAF3EF;--light-purple:#F3F6FF;color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:'Inter',Arial,sans-serif;color:#000;padding:.5rem}

.setup-card{
  background:linear-gradient(135deg,#ffffff 0%,#E4E9F7 100%);
  border:1px solid #A6B3D5;border-radius:18px;padding:28px 30px;
}
.title{font-size:20px;font-weight:700;color:var(--navy);line-height:1.3;margin-bottom:10px}
.text{font-size:18px;color:#000;line-height:1.7;margin-bottom:20px}

.btn-primary{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--blue);color:#ffffff;font-family:'Inter',sans-serif;font-weight:700;font-size:14px;
  padding:.7rem 1.2rem;border-radius:8px;text-decoration:none;transition:background .15s;
}
.btn-primary:hover{background:var(--green)}
a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>
<body>

<div class="setup-card">
  <h2 class="title">Get set up before you take off.</h2>
  <p class="text">All of Propelr's sales tools and applications can be accessed from a multitude of devices. Below are the applications you should have on your devices.</p>
  <a class="btn-primary" href="https://propelrpay1.sharepoint.com/sites/Employee-Portal/SitePages/Device-Setup.aspx" target="_blank" rel="noopener">View Device Setup</a>
</div>

</body>
</html>
